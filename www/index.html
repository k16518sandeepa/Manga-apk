<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e0f13">
  <title>Inkpage</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="views">
      <!-- LIBRARY -->
      <section id="view-library" class="view active">
        <header class="topbar">
          <h1>Library</h1>
          <button class="icon-btn" id="btn-sort" aria-label="Sort"><svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg></button>
        </header>
        <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search titles or tags" autocomplete="off"></div>
        <div id="chips" class="chips"></div>
        <div id="continue-wrap" hidden>
          <h2 class="section">Continue reading</h2>
          <div id="continue" class="hscroll"></div>
        </div>
        <h2 class="section" id="all-title">All books</h2>
        <div id="grid" class="grid"></div>
        <div id="empty" class="empty" hidden>
          <div class="empty-art"><svg viewBox="0 0 64 64"><rect x="10" y="8" width="34" height="46" rx="5"/><rect x="20" y="14" width="34" height="46" rx="5" class="f"/><path d="M29 30h16M29 38h10"/></svg></div>
          <h3>Your shelf is empty</h3>
          <p>Add your .cbz, .cbr, .cb7, .pdf or .epub files.<br>Everything stays on your phone — no ads, no accounts, no subscriptions.</p>
          <button class="btn" id="empty-add">Add comics</button>
        </div>
      </section>

      <!-- STATS -->
      <section id="view-stats" class="view">
        <header class="topbar"><h1>Reading stats</h1></header>
        <div id="stats-body"></div>
      </section>

      <!-- SETTINGS -->
      <section id="view-settings" class="view">
        <header class="topbar"><h1>Settings</h1></header>
        <div id="settings-body"></div>
      </section>
    </main>

    <button id="fab" aria-label="Add comics"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

    <nav id="tabbar">
      <button data-tab="library" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 5.5l3.8 1-3.2 13-3.8-1z"/></svg><span>Library</span></button>
      <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg><span>Settings</span></button>
    </nav>

    <input type="file" id="picker" multiple hidden>
  </div>

  <!-- READER -->
  <div id="reader" hidden data-bg="black" data-fit="screen">
    <div id="rd-stage"></div>
    <div id="rd-dim"></div>
    <div id="rd-busy" hidden>Loading…</div>
    <header id="rd-top">
      <button class="icon-btn" id="rd-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="rd-titles"><div id="rd-title"></div><div id="rd-sub"></div></div>
      <button class="icon-btn" id="rd-gear" aria-label="Reading settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </header>
    <footer id="rd-bottom">
      <input id="rd-slider" type="range" min="1" max="1" value="1">
    </footer>
    <div id="rd-sheet" class="sheet" hidden></div>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" hidden></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
